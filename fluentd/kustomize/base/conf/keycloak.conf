<source>
  @type tail
  @id keycloak.access
  tag kubernetes.keycloak.access
  @label @keycloak

  path /var/log/containers/*keycloak*.log
  pos_file /var/log/keycloak-access.pos
  read_from_head true

  <parse>
    @type none
  </parse>
</source>

<label @keycloak>

  # Keep only Keycloak HTTP access log entries
  <filter kubernetes.keycloak.access>
    @type grep
    <regexp>
      key message
      pattern /io\.quarkus\.http\.access-log/
    </regexp>
  </filter>

  # Parse the access log
  <filter kubernetes.keycloak.access>
    @type parser
    key_name message
    reserve_data true
    remove_key_name_field true

    <parse>
      @type regexp

      expression /^.*io\.quarkus\.http\.access-log:\d+\s+\[[^\]]+\]\s+-\s+(?<client-ipv4>\S+)\s+\S+\s+\S+\s+\[(?<time>[^\]]+)\]\s+"(?<request_method>\S+)\s+(?<request_uri>[^\s?"]+)(?:\?(?<args>[^\s"]*))?\s+HTTP\/[0-9.]+"\s+(?<status>\d{3})\s+(?<body_bytes_sent>\d+)$/

      time_key time
      keep_time_key true
      time_format %d/%b/%Y:%H:%M:%S %z

      types status:integer,body_bytes_sent:integer
    </parse>
  </filter>

  # Add common fields
  <filter kubernetes.keycloak.access>
    @type record_transformer
    @id keycloak_record_processing
    enable_ruby

    <record>
      fluentd_type keycloak
      europeana_cluster "#{ENV['EANA_K8S_CLUSTER']}"

      args ${record["args"] || ""}
      external_client_ip ${record["client-ipv4"]}
    </record>
  </filter>

  # Optional GeoIP enrichment (same as ingress)
  <filter kubernetes.keycloak.access>
    @type geoip
    geoip_lookup_keys external_client_ip
    backend_library geoip2_c
    geoip2_database "/usr/share/geoip/GeoLite2-City.mmdb"

    <record>
      city_name       ${city.names.en["external_client_ip"]}
      latitude        ${location.latitude["external_client_ip"]}
      longitude       ${location.longitude["external_client_ip"]}
      country_code    ${country.iso_code["external_client_ip"]}
      country_name    ${country.names.en["external_client_ip"]}
      postal_code     ${postal.code["external_client_ip"]}
      region_code     ${subdivisions.0.iso_code["external_client_ip"]}
      region_name     ${subdivisions.0.names.en["external_client_ip"]}
      skip_adding_null_record true
    </record>
  </filter>

  <match **>
    @type relabel
    @label @output
  </match>

</label>
